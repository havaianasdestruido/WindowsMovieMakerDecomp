name: Build projects

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }}
    # windows-latest can advance to an image without the VS 2022 generator.
    # This project requires the Win32 VS 2022 toolchain, so keep the runner
    # aligned with the generator used below.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project:
          - DmxBici
          - MediaCatalog
          - MetadataSys
          - MovieMaker
          - MovieMakerCore
          - MovieMakerLang
          - MovieMakerPreviewClient
          - PlaybackEngine
          - GPURenderer
          - TimelineEngine
          - UXCore
          - WLMFDS
          - WLMFReadWrite
          - WLXCodecHost
          - WLXFaceRecognition
          - WLXMP4Parser
          - WLXMediaPublishSubscribe
          - WLXMovieLibrary
          - WLXPhotoBase
          - WLXPhotoCinematic
          - WLXPhotoSqm
          - WLXPipeline
          - WLXPipetran
          - WLXSlideshow
          - WLXTranscode
          - WLXVideoTrim
          - uxctl
          - wlidcli

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Win32 build
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A Win32

      - name: Build project
        shell: pwsh
        run: |
          cmake --build build --config Debug --target ${{ matrix.project }} --parallel 2>&1 |
            Tee-Object -FilePath build-project.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Get-Content build-project.log | Select-String 'error [A-Z]+[0-9]+|fatal error' |
              Select-Object -First 30 | ForEach-Object {
                $message = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error::$message"
              }
          }
          exit $buildExit

  portable-regressions:
    name: Portable audit regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python and C++14 ASan/UBSan regressions
        shell: bash
        run: |
          status=0
          python -m unittest discover -s tests/portable -v > portable-tests.log 2>&1 || status=$?
          cat portable-tests.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              printf '::error::%s\n' "$line"
            done < portable-tests.log
          fi
          exit "$status"
